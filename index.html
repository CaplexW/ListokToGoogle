<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ListOK2Google</title>
  <!-- Подключаем Google Identity Services (GIS) -->
  <script src="https://accounts.google.com/gsi/client"></script>
</head>

<body>
  <div class="container" style="margin: 25px auto;">
    <div class="google-signin-container">
      <button id="google-signin" style="margin-bottom: 20px; background: none; border: none;" >Sign in with Google</button>
    </div>

    <select name="trainer" id="trainer-selector">
      <option value="Светлана">Светлана</option>
      <option value="Екатерина">Екатерина</option>
      <option value="Марина">Марина</option>
      <option value="Анна">Анна</option>
    </select>

    <select name="office" id="office-selector">
      <option value="0">Ленина</option>
      <option value="1">Невский</option>
    </select>

    <select name="month" id="month-selector">
      <option value="0">Январь</option>
      <option value="1">Февраль</option>
      <option value="2">Март</option>
      <option value="3">Апрель</option>
      <option value="4">Май</option>
      <option value="5">Июнь</option>
      <option value="6">Июль</option>
      <option value="7">Август</option>
      <option value="8">Сентябрь</option>
      <option value="9">Октябрь</option>
      <option value="10">Ноябрь</option>
      <option value="11">Декабрь</option>
    </select>

    <h2>Скачать файл для импорта в:</h2>
    <button id="download-button-google-calendar">Google-календарь</button>

    <h2>Импортировать в:</h2>
    <button id="import-to-google-calendar-btn" style="border: none; background: none; cursor: pointer;">
      <image width="40" src="./assets/images/Google_Calendar_icon_(2020).svg" />
    </button>
  </div>

  <script type="module" src="./googleCDNsnippet.js"></script>
  <script type="module" src="./index.js"></script>
</body>

</html>
